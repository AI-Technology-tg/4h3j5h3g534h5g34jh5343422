            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;

        h1 {

            font-size: clamp(1.7rem, 6vw, 2.35rem);

            font-weight: 800;
            letter-spacing: -0.03em;

        .social {
            width: 72px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #d6d3e8;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }
        .social span.icon {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.14);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .social:hover span.icon { transform: scale(1.07); filter: brightness(1.08); }
        .social:focus-visible { outline: none; }
        .social:focus-visible span.icon { outline: 2px solid #c4b5fd; outline-offset: 3px; }
        .social svg { width: 26px; height: 26px; fill: currentColor; }
        .tg { background: #229ed9; }
        .tt { background: #111; }
        .ig { background: radial-gradient(circle at 30% 110%, #fdf497, #fd5949 45%, #d6249f 70%, #285AEB); }
        .fb { background: #1877f2; }
        .x { background: #0a0a0a; border-color: rgba(255,255,255,0.22); }
        @media (max-width: 900px) {
            .social { width: 64px; }
            .social span.icon { width: 52px; height: 52px; }
            p { font-size: 0.98rem; }
        }
