# Android App Links: verification file (оба пути кладутся в public-build)
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# HTML — всегда проверять обновления на сервере (без залипания старых страниц в кэше)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/catalog/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/anime/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manga/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS/CSS вЂ” РєРѕСЂРѕС‚РєРёР№ РєСЌС€, Р±СЂР°СѓР·РµСЂ РїРµСЂРµРїСЂРѕРІРµСЂСЏРµС‚ РїРѕСЃР»Рµ РґРµРїР»РѕСЏ
[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://re-minko-anime.com"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Re-Minko-Device"
    Access-Control-Allow-Methods = "POST, OPTIONS, GET, HEAD"
    Cache-Control = "no-store, max-age=0"
    Vary = "Origin"
