# РћРґРёРЅ РґРµРїР»РѕР№: allowlist-СЃР±РѕСЂРєР° С„СЂРѕРЅС‚Р° + С„СѓРЅРєС†РёРё РЅР° С‚РѕРј Р¶Рµ РґРѕРјРµРЅРµ.
# РџРµСЂРµРјРµРЅРЅС‹Рµ РѕРєСЂСѓР¶РµРЅРёСЏ вЂ” РєР°Рє РІ minko-netlify-proxy/README.md (MINKO_*, OPENAI_*, XAI_*, SUPABASE_*).

[build]
  command = "npm run build:public"
  publish = "public-build"
  functions = "minko-netlify-proxy/netlify/functions"

[build.environment]
  # config.local.js вЂ” С‚РѕР»СЊРєРѕ РґР»СЏ РџРљ; РЅР° Netlify СЃРµРєСЂРµС‚С‹ РІ Environment variables
  # assetlinks содержит SHA256 fingerprint APK — иначе Secrets Scan валит билд
  SECRETS_SCAN_OMIT_PATHS = "config.local.js,assetlinks.json,.well-known/assetlinks.json,public-build/assetlinks.json,public-build/.well-known/assetlinks.json"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "ip-block"
  path = "/*"

# web_search (Responses API) РґРѕР»СЊС€Рµ РѕР±С‹С‡РЅРѕРіРѕ chat вЂ” РЅСѓР¶РµРЅ Р·Р°РїР°СЃ РЅР° Pro/Team
[functions."minko-chat"]
  timeout = 26

[functions."desktop-minko"]
  timeout = 26

[[redirects]]
  from = "/config.local.js"
  to = "/config.local.stub.js"
  status = 200
  force = true

[[redirects]]
  from = "/chat"
  to = "/.netlify/functions/minko-chat"
  status = 200
  force = true

# Приватные обновления мобильного APK (ключ в заголовке/query)
[[redirects]]
  from = "/mobile/update"
  to = "/.netlify/functions/mobile-apk"
  status = 200
  force = true

# Private desktop releases: IP gate + server-side GitHub token.
[[redirects]]
  from = "/desktop/release"
  to = "/.netlify/functions/desktop-release"
  status = 200
  force = true

[[redirects]]
  from = "/desktop/watch"
  to = "/.netlify/functions/desktop-watch"
  status = 200
  force = true

[[redirects]]
  from = "/desktop/minko"
  to = "/.netlify/functions/desktop-minko"
  status = 200
  force = true

[[redirects]]
  from = "/r/:code"
  to = "/index.html?gref=:code"
  status = 302

[[redirects]]
  from = "/friends.html"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/messages.html"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/watch-together.html"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/minko-ai.html"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/minko-edit.html"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/favorites.html"
  to = "/catalog/anime.html"
  status = 301

[[redirects]]
  from = "/history.html"
  to = "/index.html"
  status = 301

[[redirects]]
