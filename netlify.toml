# РћРґРёРЅ РґРµРїР»РѕР№: allowlist-СЃР±РѕСЂРєР° С„СЂРѕРЅС‚Р° + С„СѓРЅРєС†РёРё РЅР° С‚РѕРј Р¶Рµ РґРѕРјРµРЅРµ.
# РџРµСЂРµРјРµРЅРЅС‹Рµ РѕРєСЂСѓР¶РµРЅРёСЏ вЂ” РєР°Рє РІ minko-netlify-proxy/README.md (MINKO_*, OPENAI_*, XAI_*, SUPABASE_*).

[build]
  command = "npm run build:public"
  publish = "public-build"
  functions = "minko-netlify-proxy/netlify/functions"

[build.environment]
  # config.local.js вЂ” С‚РѕР»СЊРєРѕ РґР»СЏ РџРљ; РЅР° Netlify СЃРµРєСЂРµС‚С‹ РІ Environment variables
  # assetlinks содержит SHA256 fingerprint APK — иначе Secrets Scan валит билд
  SECRETS_SCAN_OMIT_PATHS = "config.local.js,assetlinks.json,.well-known/assetlinks.json,public-build/assetlinks.json,public-build/.well-known/assetlinks.json"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "ip-block"
  path = "/*"

# web_search (Responses API) РґРѕР»СЊС€Рµ РѕР±С‹С‡РЅРѕРіРѕ chat вЂ” РЅСѓР¶РµРЅ Р·Р°РїР°СЃ РЅР° Pro/Team
[functions."minko-chat"]
  timeout = 26

# SITE_CLOSED: сначала исключения, затем всё остальное → заглушка.
# Чтобы открыть сайт — удали этот блок и force-редирект /*.
[[redirects]]
  from = "/scripts/desktop-only-guard.js"
  to = "/scripts/desktop-only-guard.js"
  status = 200

[[redirects]]
  from = "/site-closed.html"
  to = "/site-closed.html"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200

[[redirects]]
  from = "/googled5f0682df83b4e0e.html"
  to = "/googled5f0682df83b4e0e.html"
  status = 200

[[redirects]]
  from = "/yandex_7826d5f9bd1db2e7.html"
  to = "/yandex_7826d5f9bd1db2e7.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/config.local.js"
  to = "/config.local.stub.js"
  status = 200
  force = true

[[redirects]]
  from = "/chat"
  to = "/.netlify/functions/minko-chat"
  status = 200
  force = true

# Приватные обновления мобильного APK (ключ в заголовке/query)
[[redirects]]
  from = "/mobile/update"
  to = "/.netlify/functions/mobile-apk"
  status = 200
  force = true

[[redirects]]
  from = "/r/:code"
  to = "/index.html?gref=:code"
  status = 302

# Android App Links: verification file (оба пути кладутся в public-build)
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# HTML — всегда проверять обновления на сервере (без залипания старых страниц в кэше)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/catalog/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/anime/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manga/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS/CSS вЂ” РєРѕСЂРѕС‚РєРёР№ РєСЌС€, Р±СЂР°СѓР·РµСЂ РїРµСЂРµРїСЂРѕРІРµСЂСЏРµС‚ РїРѕСЃР»Рµ РґРµРїР»РѕСЏ
[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://re-minko-anime.com"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "POST, OPTIONS, GET, HEAD"
    Vary = "Origin"
