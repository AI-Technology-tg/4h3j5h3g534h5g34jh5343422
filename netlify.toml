# РћРґРёРЅ РґРµРїР»РѕР№: allowlist-СЃР±РѕСЂРєР° С„СЂРѕРЅС‚Р° + С„СѓРЅРєС†РёРё РЅР° С‚РѕРј Р¶Рµ РґРѕРјРµРЅРµ.
# РџРµСЂРµРјРµРЅРЅС‹Рµ РѕРєСЂСѓР¶РµРЅРёСЏ вЂ” РєР°Рє РІ minko-netlify-proxy/README.md (MINKO_*, OPENAI_*, XAI_*, SUPABASE_*).

[build]
  command = "npm run build:public"
  publish = "public-build"
  functions = "minko-netlify-proxy/netlify/functions"

[build.environment]
  # config.local.js вЂ” С‚РѕР»СЊРєРѕ РґР»СЏ РџРљ; РЅР° Netlify СЃРµРєСЂРµС‚С‹ РІ Environment variables
  SECRETS_SCAN_OMIT_PATHS = "config.local.js"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "ip-block"
  path = "/*"

# web_search (Responses API) РґРѕР»СЊС€Рµ РѕР±С‹С‡РЅРѕРіРѕ chat вЂ” РЅСѓР¶РµРЅ Р·Р°РїР°СЃ РЅР° Pro/Team
[functions."minko-chat"]
  timeout = 26

[[redirects]]
  from = "/config.local.js"
  to = "/config.local.stub.js"
  status = 200
  force = true

[[redirects]]
  from = "/chat"
  to = "/.netlify/functions/minko-chat"
  status = 200
  force = true

# Приватные обновления мобильного APK (ключ в заголовке/query)
[[redirects]]
  from = "/mobile/update"
  to = "/.netlify/functions/mobile-apk"
  status = 200
  force = true

[[redirects]]
  from = "/r/:code"
  to = "/index.html?gref=:code"
  status = 302

# HTML вЂ” РІСЃРµРіРґР° РїСЂРѕРІРµСЂСЏС‚СЊ РѕР±РЅРѕРІР»РµРЅРёСЏ РЅР° СЃРµСЂРІРµСЂРµ (Р±РµР· Р·Р°Р»РёРїР°РЅРёСЏ СЃС‚Р°СЂС‹С… СЃС‚СЂР°РЅРёС† РІ РєСЌС€Рµ)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/catalog/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/anime/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manga/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS/CSS вЂ” РєРѕСЂРѕС‚РєРёР№ РєСЌС€, Р±СЂР°СѓР·РµСЂ РїРµСЂРµРїСЂРѕРІРµСЂСЏРµС‚ РїРѕСЃР»Рµ РґРµРїР»РѕСЏ
[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://re-minko-anime.com"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "POST, OPTIONS, GET, HEAD"
    Vary = "Origin"
