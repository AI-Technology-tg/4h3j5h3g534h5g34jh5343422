  to = "/catalog/anime.html"
  status = 301

[[redirects]]
  from = "/catalog/calendar.html"
  to = "/catalog/anime.html"
  status = 301

[[redirects]]
  from = "/catalog/anime-4k.html"
  to = "/catalog/anime.html"
  status = 301

[[redirects]]
  from = "/anime/view-4k.html"
  to = "/catalog/anime.html"
