# Один деплой: allowlist-сборка фронта + функции на том же домене.
# Переменные окружения — как в minko-netlify-proxy/README.md (MINKO_*, OPENAI_*, XAI_*, SUPABASE_*).

[build]
  command = "npm run build:public"
  publish = "public-build"
  functions = "minko-netlify-proxy/netlify/functions"

[build.environment]
  # config.local.js — только для ПК; на Netlify секреты в Environment variables
  SECRETS_SCAN_OMIT_PATHS = "config.local.js"

[functions]
  node_bundler = "esbuild"

# web_search (Responses API) дольше обычного chat — нужен запас на Pro/Team
[functions."minko-chat"]
  timeout = 26

[[redirects]]
  from = "/config.local.js"
  to = "/config.local.stub.js"
  status = 200
  force = true

[[redirects]]
  from = "/chat"
  to = "/.netlify/functions/minko-chat"
  status = 200
  force = true

[[redirects]]
  from = "/r/:code"
  to = "/index.html?gref=:code"
  status = 302

# HTML — всегда проверять обновления на сервере (без залипания старых страниц в кэше)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/catalog/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/anime/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manga/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS/CSS — короткий кэш, браузер перепроверяет после деплоя
[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://re-minko-anime.com"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "POST, OPTIONS, GET, HEAD"
    Vary = "Origin"
