name: Anime Automation

on:
  schedule:
    # Каждые 3 часа в :20 UTC (не в ровное :00) — ≈ 02:20 / 05:20 / 08:20 / … по Киеву (UTC+2/+3)
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-anime-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update Kodik catalog
        env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
        run: npm run automate:anime:api:enrich

      # Не auto-commit-action: при push на main во время джобы был non-fast-forward
      - name: Commit and push catalog data
        env:
          GIT_AUTHOR_NAME: AI-Technology-tg
          GIT_AUTHOR_EMAIL: 235368487+AI-Technology-tg@users.noreply.github.com
          GIT_COMMITTER_NAME: AI-Technology-tg
          GIT_COMMITTER_EMAIL: 235368487+AI-Technology-tg@users.noreply.github.com
        run: |
          set -euo pipefail
          # Маленький манифест для десктопа (проверка свежести без скачивания 18MB)
          node -e "
            const fs=require('fs');
            const path=require('path');
            const data=path.join('data');
            const files=[
              'kodik-anime-catalog.json',
              'kodik-calendar.json',
              'kodik-announced.json',
              'kodik-home-strips.json',
              'remanga-manga-catalog.json',
              'anime-automation-report.json'
            ];
            const out={ builtAt:new Date().toISOString(), source:'anime-automation', files:{} };
            for (const f of files) {
              const p=path.join(data,f);
              if (!fs.existsSync(p)) continue;
              const st=fs.statSync(p);
              let builtAt=null;
              try {
                const j=JSON.parse(fs.readFileSync(p,'utf8'));
                builtAt=(j && j.meta && j.meta.builtAt) || j.builtAt || null;
              } catch (_) {}
              out.files[f]={ bytes: st.size, mtime: st.mtime.toISOString(), builtAt };
            }
            fs.writeFileSync(path.join(data,'catalog-manifest.json'), JSON.stringify(out,null,2));
            console.log('catalog-manifest.json written');
          "

          git add \
            data/kodik-anime-catalog.json \
            data/kodik-calendar.json \
            data/kodik-announced.json \
            data/kodik-home-strips.json \
            data/catalog-manifest.json \
            data/anime-automation-report.json \
            data/anime-enrichment-cache.json \
            sitemap.xml || true
          if git diff --cached --quiet; then
            echo "No catalog changes to commit"
            exit 0
          fi
          git commit -m "update anime catalog data"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected, retry $i…"
            sleep $((i * 3))
          done
          echo "Failed to push catalog update after retries"
          exit 1
